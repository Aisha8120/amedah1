      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>

n    <div style=\"position:absolute;bottom:34px;left:50%;transform:translateX(-50%);z-index:5;display:flex;flex-direction:column;align-items:center;gap:10px;animation:amBob 2.6s ease-in-out infinite\">\n      <span style=\"width:1px;height:38px;background:linear-gradient(180deg,var(--accent-bright),transparent)\"><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- ===================== WHY (problem) ===================== -->\n  <section id=\"why\" style=\"position:relative;z-index:5;max-width:1100px;margin:0 auto;padding:130px 32px\">\n    <p data-amr=\"\" style=\"opacity:0;transform:translateY(20px);transition:all .9s cubic-bezier(.16,1,.3,1);font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.22em;color:var(--accent-bright);margin-bottom:34px\">/ لماذا أعمدة<\u002Fp>\n    <h2 data-amr=\"\" style=\"opacity:0;filter:blur(12px);transform:translateY(20px);transition:opacity 1.1s cubic-bezier(.16,1,.3,1),filter 1.1s cubic-bezier(.16,1,.3,1),transform 1.1s cubic-bezier(.16,1,.3,1);font-size:clamp(1.9rem,4.4vw,3.4rem);font-weight:500;line-height:1.35;letter-spacing:-.01em;max-width:920px\">\n      معظم المتاجر لا تتعثّر بسبب المنتج، ولا بسبب التسويق —\n      <span style=\"color:#5e688c\">بل لأن ما يحدث داخل المتجر غير منظّم.<\u002Fspan>\n    <\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:64px\" data-stagger=\"\">\n      <sc-for list=\"{{ chaos }}\" as=\"c\" hint-placeholder-count=\"4\">\n        <div data-amr=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1),border-color .3s,background .3s;padding:26px 24px;border-radius:18px;border:1px solid rgba(120,140,220,.12);background:linear-gradient(160deg,rgba(255,255,255,.035),rgba(255,255,255,.008))\" style-hover=\"border-color:rgba(91,127,255,.35);background:linear-gradient(160deg,rgba(91,127,255,.08),rgba(255,255,255,.01))\">\n          <div style=\"display:flex;align-items:flex-end;gap:3px;height:26px;margin-bottom:18px\">\n            <div style=\"width:4px;height:45%;background:var(--accent-bright);border-radius:2px;opacity:.6\"><\u002Fdiv>\n            <div style=\"width:4px;height:75%;background:var(--accent-bright);border-radius:2px;opacity:.8\"><\u002Fdiv>\n            <div style=\"width:4px;height:100%;background:var(--accent-bright);border-radius:2px\"><\u002Fdiv>\n            <div style=\"width:4px;height:60%;background:var(--accent-bright);border-radius:2px;opacity:.5\"><\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"font-size:16px;color:#cbd2e6;line-height:1.7;font-weight:400\">{{ c }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p data-amr=\"\" style=\"opacity:0;transform:translateY(20px);transition:all .9s cubic-bezier(.16,1,.3,1);margin-top:48px;font-size:clamp(1.2rem,2.2vw,1.7rem);font-weight:500;color:#e7ebf6\">في أعمدة، نعيد بناء هذا الأساس بالكامل.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- ===================== WHAT IS AMEDAH ===================== -->\n  <section style=\"position:relative;z-index:5;padding:110px 32px;border-top:1px solid rgba(120,140,220,.07)\">\n    <div style=\"max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:54px\" data-whatgrid=\"\">\n      <div data-amr=\"\" style=\"opacity:0;transform:translateX(30px);transition:all 1s cubic-bezier(.16,1,.3,1)\">\n        <p style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.22em;color:var(--accent-bright);margin-bottom:24px\">/ ما هي أعمدة<\u002Fp>\n        <h2 style=\"font-size:clamp(1.8rem,4vw,3rem);font-weight:500;line-height:1.4;letter-spacing:-.01em;max-width:780px\">وكالة متخصصة في تأسيس الأنظمة التشغيلية للمتاجر الإلكترونية. نحوّل <span style=\"color:var(--accent-bright)\">الفوضى إلى نظام<\u002Fspan>، والاجتهاد الفردي إلى تشغيل احترافي.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px\" data-stagger=\"\">\n        <sc-for list=\"{{ whatCards }}\" as=\"w\" hint-placeholder-count=\"3\">\n          <div data-amr=\"\" data-tilt=\"\" style=\"opacity:0;transform:translateY(34px);transition:opacity .9s cubic-bezier(.16,1,.3,1),transform .35s cubic-bezier(.16,1,.3,1),border-color .3s,box-shadow .3s;padding:32px 28px;border-radius:22px;border:1px solid rgba(120,140,220,.12);background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(255,255,255,.008));backdrop-filter:blur(10px)\" style-hover=\"border-color:rgba(91,127,255,.4);box-shadow:0 24px 60px -22px var(--glow)\">\n            <div style=\"width:48px;height:48px;border-radius:14px;background:linear-gradient(150deg,rgba(91,127,255,.25),rgba(50,93,222,.08));border:1px solid rgba(120,140,220,.2);display:flex;align-items:center;justify-content:center;margin-bottom:22px;animation:amFloat 5s ease-in-out infinite\">\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--accent-bright);font-weight:500\">{{ w.k }}<\u002Fspan>\n            <\u002Fdiv>\n            <h3 style=\"font-size:19px;font-weight:600;margin-bottom:12px;color:#f4f6fb\">{{ w.t }}<\u002Fh3>\n            <p style=\"font-size:15px;line-height:1.85;color:#97a1bf;font-weight:300\">{{ w.d }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== NEED (challenges checklist) ===================== -->\n  <section style=\"position:relative;z-index:5;padding:110px 32px;border-top:1px solid rgba(120,140,220,.07)\">\n    <div style=\"max-width:1100px;margin:0 auto\">\n      <div data-amr=\"\" style=\"opacity:0;transform:translateY(20px);transition:all .9s cubic-bezier(.16,1,.3,1);text-align:center;margin-bottom:60px\">\n        <p style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.22em;color:var(--accent-bright);margin-bottom:20px\">/ لماذا تحتاج أعمدة<\u002Fp>\n        <h2 style=\"font-size:clamp(1.8rem,4vw,3rem);font-weight:500;line-height:1.3\">إذا كنت تواجه أحد هذه التحديات…<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px\" data-stagger=\"\">\n        <sc-for list=\"{{ pains }}\" as=\"p\" hint-placeholder-count=\"6\">\n          <div data-amr=\"\" style=\"opacity:0;transform:scale(.94);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1),border-color .3s,background .3s;display:flex;align-items:center;gap:16px;padding:20px 22px;border-radius:14px;border:1px solid rgba(120,140,220,.1);background:rgba(255,255,255,.018)\" style-hover=\"border-color:rgba(91,127,255,.35);background:rgba(91,127,255,.06)\">\n            <span style=\"flex-shrink:0;width:30px;height:30px;border-radius:9px;border:1px solid rgba(120,140,220,.25);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--accent-bright)\">{{ p.n }}<\u002Fspan>\n            <span style=\"font-size:15px;color:#cbd2e6;line-height:1.6;font-weight:400\">{{ p.t }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div data-amr=\"\" data-cta-box=\"\" style=\"opacity:0;transform:translateY(20px);transition:all .9s cubic-bezier(.16,1,.3,1);margin-top:54px;text-align:center;padding:38px;border-radius:22px;border:1px solid rgba(91,127,255,.18);background:linear-gradient(160deg,rgba(91,127,255,.08),transparent)\">\n        <p style=\"font-size:clamp(1.3rem,2.6vw,2rem);font-weight:500;line-height:1.6\">فأنت لا تحتاج موظفين أكثر — <span style=\"color:var(--accent-bright)\">بل تحتاج أساسًا تشغيليًا أفضل.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== JOURNEY (timeline) ===================== -->\n  <section id=\"journey\" style=\"position:relative;z-index:5;padding:120px 32px;border-top:1px solid rgba(120,140,220,.07)\">\n    <div style=\"max-width:980px;margin:0 auto\">\n      <div data-amr=\"\" style=\"opacity:0;transform:translateY(20px);transition:all .9s cubic-bezier(.16,1,.3,1);text-align:center;margin-bottom:80px\">\n        <p style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.22em;color:var(--accent-bright);margin-bottom:20px\">/ رحلة الثلاثة أشهر<\u002Fp>\n        <h2 style=\"font-size:clamp(1.9rem,4.4vw,3.2rem);font-weight:500;line-height:1.3\">نحلّل، ونبني، ونطبّق، ونتابع<br>حتى يصبح التشغيل جزءًا من قوة متجرك<\u002Fh2>\n      <\u002Fdiv>\n      <div ref=\"{{ timelineRef }}\" style=\"position:relative;padding-right:60px\">\n        <!-- track -->\n        <div style=\"position:absolute;top:6px;bottom:6px;right:21px;width:2px;background:rgba(120,140,220,.12);border-radius:2px\"><\u002Fdiv>\n        <div ref=\"{{ timelineFillRef }}\" style=\"position:absolute;top:6px;right:21px;width:2px;height:0%;background:linear-gradient(180deg,var(--accent),var(--accent-bright));border-radius:2px;box-shadow:0 0 14px var(--glow)\"><\u002Fdiv>\n        <sc-for list=\"{{ months }}\" as=\"m\" hint-placeholder-count=\"3\">\n          <div data-amr=\"\" style=\"opacity:0;transform:translateX(34px);transition:opacity .9s cubic-bezier(.16,1,.3,1),transform .9s cubic-bezier(.16,1,.3,1);position:relative;margin-bottom:46px\">\n            <div data-tl-node=\"\" style=\"position:absolute;right:-49px;top:2px;width:44px;height:44px;border-radius:50%;background:#080b18;border:1px solid rgba(120,140,220,.25);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:14px;color:#7a85ad;transition:all .5s;z-index:2\">{{ m.en }}<\u002Fdiv>\n            <div data-tilt=\"\" style=\"padding:30px 30px;border-radius:22px;border:1px solid rgba(120,140,220,.12);background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(255,255,255,.008));backdrop-filter:blur(10px);transition:transform .35s cubic-bezier(.16,1,.3,1),border-color .3s,box-shadow .3s\" style-hover=\"border-color:rgba(91,127,255,.4);box-shadow:0 26px 64px -24px var(--glow)\">\n              <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:20px;flex-wrap:wrap\">\n                <span style=\"font-size:13px;color:var(--accent-bright);font-weight:500\">{{ m.sub }}<\u002Fspan>\n                <h3 style=\"font-size:clamp(1.4rem,3vw,2rem);font-weight:600\">{{ m.title }}<\u002Fh3>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 24px\">\n                <sc-for list=\"{{ m.lines }}\" as=\"line\" hint-placeholder-count=\"4\">\n                  <div style=\"display:flex;align-items:center;gap:11px\">\n                    <span style=\"flex-shrink:0;width:5px;height:5px;border-radius:50%;background:var(--accent-bright);box-shadow:0 0 8px var(--glow)\"><\u002Fspan>\n                    <span style=\"font-size:15px;color:#a9b1cc;font-weight:300;line-height:1.6\">{{ line }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== DIFFERENTIATORS ===================== -->\n  <section style=\"position:relative;z-index:5;padding:110px 32px;border-top:1px solid rgba(120,140,220,.07)\">\n    <div style=\"max-width:1100px;margin:0 auto\">\n      <div data-amr=\"\" style=\"opacity:0;transform:translateY(20px);transition:all .9s cubic-bezier(.16,1,.3,1);margin-bottom:54px\">\n        <p style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.22em;color:var(--accent-bright);margin-bottom:20px\">/ ماذا يميّز أعمدة<\u002Fp>\n        <h2 style=\"font-size:clamp(1.8rem,4vw,3rem);font-weight:500;line-height:1.4;max-width:860px\">لسنا شركة تقدّم ملفات PDF ثم تنتهي المهمة. <span style=\"color:#5e688c\">نبني نظام تشغيل حقيقي ونرافقك حتى يصبح جزءًا من طريقة عمل المتجر.<\u002Fspan><\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px\" data-stagger=\"\">\n        <sc-for list=\"{{ diffs }}\" as=\"d\" hint-placeholder-count=\"4\">\n          <div data-amr=\"\" data-tilt=\"\" style=\"opacity:0;filter:blur(10px);transform:translateY(26px);transition:opacity .9s cubic-bezier(.16,1,.3,1),filter .9s cubic-bezier(.16,1,.3,1),transform .35s cubic-bezier(.16,1,.3,1),border-color .3s,box-shadow .3s;padding:30px 26px;border-radius:20px;border:1px solid rgba(120,140,220,.12);background:linear-gradient(160deg,rgba(255,255,255,.035),rgba(255,255,255,.006))\" style-hover=\"border-color:rgba(91,127,255,.4);box-shadow:0 22px 56px -22px var(--glow)\">\n            <div style=\"display:flex;align-items:flex-end;gap:4px;height:30px;margin-bottom:20px\">\n              <div style=\"width:5px;height:50%;background:var(--accent-bright);border-radius:2px;opacity:.55\"><\u002Fdiv>\n              <div style=\"width:5px;height:80%;background:var(--accent-bright);border-radius:2px;opacity:.8\"><\u002Fdiv>\n              <div style=\"width:5px;height:100%;background:var(--accent-bright);border-radius:2px\"><\u002Fdiv>\n            <\u002Fdiv>\n            <h3 style=\"font-size:17px;font-weight:600;margin-bottom:9px\">{{ d.t }}<\u002Fh3>\n            <p style=\"font-size:14px;line-height:1.8;color:#97a1bf;font-weight:300\">{{ d.d }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== SMART SYSTEM (SaaS mockup) ===================== -->\n  <section id=\"system\" style=\"position:relative;z-index:5;padding:120px 32px;border-top:1px solid rgba(120,140,220,.07);overflow:hidden\">\n    <div style=\"position:absolute;top:10%;left:-5%;width:40vw;height:40vw;background:radial-gradient(circle,rgba(50,93,222,.18),transparent 60%);filter:blur(50px);z-index:0;pointer-events:none\"><\u002Fdiv> \"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-right:auto;font-size:12px;color:#6c769a;font-family:'IBM Plex Mono',monospace\">amedah.os / لوحة المتابعة<\u002Fdiv>\n          <span style=\"font-size:11px;color:#4f7bff;border:1px solid rgba(91,127,255,.3);border-radius:6px;padding:3px 9px\">مباشر<\u002Fspan>\n        <\u002Fdiv>\n        <div data-dash-grid=\"\" style=\"display:grid;grid-template-columns:200px 1fr;min-height:440px\">\n          <!-- sidebar -->\n          <div style=\"border-left:1px solid rgba(120,140,220,.1);padding:20px 16px;display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.01)\" data-sidebar=\"\">\n            <div style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:linear-gradient(135deg,rgba(91,127,255,.18),rgba(50,93,222,.05));border:1px solid rgba(91,127,255,.2)\">\n              <span style=\"width:8px;height:8px;border-radius:2px;background:var(--accent-bright)\"><\u002Fspan>\n              <span style=\"font-size:13px;color:#e7ebf6\">لوحة المتابعة<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ navItems }}\" as=\"ni\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;transition:background .25s\" style-hover=\"background:rgba(255,255,255,.04)\">\n                <span style=\"width:8px;height:8px;border-radius:2px;background:#39426a\"><\u002Fspan>\n                <span style=\"font-size:13px;color:#8b94b4\">{{ ni }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <!-- main -->\n          <div data-dash-mainpad=\"\" style=\"padding:24px;display:flex;flex-direction:column;gap:18px\">\n            <!-- KPI row -->\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px\">\n              <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"4\ atures }}\" as=\"f\" hint-placeholder-count=\"7\">\n          <div data-amr=\"\" style=\"opacity:0;transform:translateY(24px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1),border-color .3s,background .3s;display:flex;align-items:center;gap:13px;padding:18px 20px;border-radius:14px;border:1px solid rgba(120,140,220,.1);background:rgba(255,255,255,.018)\" style-hover=\"border-color:rgba(91,127,255,.35);background:rgba(91,127,255,.05)\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--accent-bright);opacity:.8\">{{ f.n }}<\u002Fspan>\n            <span style=\"font-size:14px;color:#cbd2e6;font-weight:400\">{{ f.t }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== RESULTS + STATS ===================== -->\n  <section id=\"results\" style=\"position:relative;z-index:5;padding:120px 32px;border-top:1px solid rgba(120,140,220,.07)\">\n    <div style=\"max-width:1100px;margin:0 auto\">\n      <div data-amr=\"\" style=\"opacity:0;transform:translateY(20px);transition:all .9s cubic-bezier(.16,1,.3,1);text-align:center;margin-bottom:64px\">\n        <p style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.22em;color:var(--accent-bright);margin-bottom:20px\">/ النتائج التي نسعى لها<\u002Fp>\n        <h2 style=\"font-size:clamp(1.9rem,4.4vw,3.2rem);font-weight:500;line-height:1.3\">تشغيل أكثر استقرارًا<br>وقابلية للتوسّع دون فوضى<\u002Fh2>\n      <\u002Fdiv>\n      <!-- stat strip -->\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0;border:1px solid rgba(120,140,220,.12);border-radius:22px;overflow:hidden;margin-bottom:48px;background:linear-gradient(160deg,rgba(91,127,255,.05),transparent)\" data-stagger=\"\">\n        <sc-for list=\"{{ stats }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <div data-amr=\"\" data-stat-cell ORY ===================== -->\n  <section style=\"position:relative;z-index:5;padding:120px 32px;border-top:1px solid rgba(120,140,220,.07)\">\n    <div style=\"max-width:840px;margin:0 auto;text-align:center\">\n      <p data-amr=\"\" style=\"opacity:0;transform:translateY(20px);transition:all .9s cubic-bezier(.16,1,.3,1);font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.22em;color:var(--accent-bright);margin-bottom:30px\">/ قصتنا<\u002Fp>\n      <h2 data-amr=\"\" style=\"opacity:0;filter:blur(12px);transform:translateY(20px);transition:opacity 1.1s cubic-bezier(.16,1,.3,1),filter 1.1s cubic-bezier(.16,1,.3,1),transform 1.1s cubic-bezier(.16,1,.3,1);font-size:clamp(1.6rem,3.6vw,2.6rem);font-weight:400;line-height:1.7;letter-spacing:-.01em;color:#c7cee4\">كثير من المتاجر تمتلك منتجات ممتازة وتسويقًا جيدًا، لكنها تخسر بسبب التشغيل. لهذا جاء اسم <span style=\"color:var(--accent-bright);font-weight:600\">«أعمدة»<\u002Fspan> — لأن أي نجاح طويل المدى يحتاج إلى أعمدة ثابتة يُبنى عليها، ونؤمن أن التشغيل هو أهم تلك الأعمدة.<\u002Fh2>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== FINAL CTA ===================== -->\n  <section id=\"contact\" style=\"position:relative;z-index:5;padding:130px 32px 120px;border-top:1px solid rgba(120,140,220,.07);overflow:hidden\">\n    <div style=\"position:absolute;inset:0;z-index:0;background:radial-gradient(circle at 50% 120%,rgba(50,93,222,.35),transparent 60%);pointer-events:none\"><\u002Fdiv>\n    <div data-amr=\"\" style=\"opacity:0;transform:translateY(34px);transition:all 1s cubic-bezier(.16,1,.3,1);position:relative;z-index:2;max-width:820px;margin:0 auto;text-align:center\">\n      <h2 style=\"font-size:clamp(2.1rem,5.4vw,4rem);font-weight:600;line-height:1.3;letter-spacing:-.02em;margin-bottom:26px;background:linear-gradient(180deg,#fff 40%,#aab4d8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent\">متجرك يستحق نظامًا يعمل<br>حتى عندما لا تكون موجودًا<\u002Fh2>\n      <p style=\"font-size:clamp(1rem,1.5vw,1.2rem);color:#9aa3bf;line-height:1.9;margin-bottom:42px;font-weight:300\">ابدأ رحلة التأسيس اليوم، واجعل التشغيل أحد أكبر نقاط القوة في متجرك.<\u002Fp>\n      <a href=\"#\" onmouseenter=\"{{ onBtnEnter }}\" onmouseleave=\"{{ onLinkLeave }}\" style=\"display:inline-flex;align-items:center;gap:12px;padding:18px 42px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent-bright));color:#fff;text-decoration:none;font-size:17px;font-weight:600;box-shadow:0 20px 50px -14px var(--glow);transition:transform .3s,box-shadow .3s\" style-hover=\"transform:translateY(-3px) scale(1.02);box-shadow:0 28px 60px -14px var(--glow)\">انتظرونا قريبًا\n        <span style=\"font-size:19px\">←<\u002Fspan>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== FOOTER ===================== -->\n  <footer style=\"position:relative;z-index:5;padding:44px 32px;border-top:1px solid rgba(120,140,220,.1)\">\n    <div style=\"max-width:1240px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap\">\n      <img src=\"ff947bb4-c34e-4d25-93b9-d92930d57d99\" alt=\"أعمدة\" style=\"height:28px;width:auto;opacity:.75\">\n      <p style=\"font-size:13px;color:#5d678a;font-weight:300\">© 2026 أعمدة — وكالة تأسيس الأنظمة التشغيلية للمتاجر<\u002Fp>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#325dde&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#325dde&quot;,&quot;#5b7fff&quot;,&quot;#6f5bff&quot;,&quot;#2f8f6b&quot;]},&quot;reduceMotion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  canvasRef = React.createRef();\n  rootRef = React.createRef();\n  cursorRef = React.createRef();\n  glowRef = React.createRef();\n  navRef = React.createRef();\n  progressRef = React.createRef();\n  timelineRef = React.createRef();\n  timelineFillRef = React.createRef();\n  burgerRef = React.createRef();\n  burgerIconRef = React.createRef();\n  menuRef = React.createRef();\n  state = { menuOpen: false };\n\n  renderVals() {\n    const ar = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];\n    return {\n      rootRef: this.rootRef, canvasRef: this.canvasRef, cursorRef: this.cursorRef,\n      glowRef: this.glowRef, navRef: this.navRef, progressRef: this.progressRef,\n      timelineRef: this.timelineRef, timelineFillRef: this.timelineFillRef,\n      burgerRef: this.burgerRef, burgerIconRef: this.burgerIconRef, menuRef: this.menuRef,\n      toggleMenu: () => this._setMenu(!this.state.menuOpen),\n      closeMenu: () => this._setMenu(false),\n      onLinkEnter: () => this._cursor(2.0, false),\n      onBtnEnter: () => this._cursor(2.4, true),\n      onLinkLeave: () => this._cursor(1, false),\n      chaos: ['المهام تضيع', 'تتكرر الأخطاء', 'لا توجد إجراءات واضحة', 'الفريق لا يعرف ما يجب أن يحدث'],\n      whatCards: [\n        { k: '01', t: 'نؤسّس النظام', d: 'نبني طريقة عمل واضحة يستطيع الفريق الاعتماد عليها يوميًا.' },\n        { k: '02', t: 'نطبّق ونتابع', d: 'نرافقك أثناء التنفيذ ونقيس النتائج ونعدّل الإجراءات عند الحاجة.' },\n        { k: '03', t: 'نثبّت ونحسّن', d: 'نسلّمك تشغيلًا مستقرًا يمكن البناء عليه مستقبلًا.' },\n      ],\n      pains: [\n        { n: '٠١', t: 'المهام تضيع بين الموظفين' },\n        { n: '٠٢', t: 'كل شخص يعمل بطريقته الخاصة' },\n        { n: '٠٣', t: 'لا يوجد نظام واضح للتشغيل' },\n        { n: '٠٤', t: 'تعتمد على أشخاص أكثر من النظام' },\n        { n: '٠٥', t: 'صعوبة في متابعة الأداء' },\n        { n: '٠٦', t: 'المتجر يتوقف عند غياب شخص واحد' },\n      ],\n      months: [\n        { en: '01', sub: 'الشهر الأول', title: 'التأسيس', lines: ['ندرس المتجر بالكامل', 'نحلّل العمليات', 'نحدّد نقاط الضعف', 'نبني الخطة التشغيلية', 'نصمّم الإجراءات', 'نبدأ تأسيس النظام'] },\n        { en: '02', sub: 'الشهر الثاني', title: 'التطبيق والمتابعة', lines: ['نطبّق النظام داخل المتجر', 'نتابع التنفيذ', 'نقيس النتائج', 'نعدّل الإجراءات عند الحاجة'] },\n        { en: '03', sub: 'الشهر الثالث', title: 'التثبيت والتحسين', lines: ['نتأكد من عمل الفريق وفق النظام', 'نعالج التحديات الظاهرة', 'نسلّمك تشغيلًا مستقرًا'] },\n      ],\n      diffs: [\n        { t: 'تطبيق لا تنظير', d: 'لا ملفات PDF تُنسى، بل نظام تشغيل حقيقي قابل للتنفيذ.' },\n        { t: 'مرافقة مستمرة', d: 'نرافقك أثناء التطبيق ولا نتركك مع خطة على الورق.' },\n        { t: 'قياس النتائج', d: 'نتابع الأثر الفعلي ونعدّل بناءً على الأرقام.' },\n        { t: 'مصمّم لمتجرك', d: 'نظام يناسب فريقك وعملياتك، لا قالب جاهز.' },\n      ],\n      navItems: ['الإجراءات', 'المهام اليومية', 'النماذج', 'الأدلة الداخلية', 'مؤشرات الأداء'],\n      kpis: [\n        { label: 'مهام مكتملة', val: 86, suffix: '٪' },\n        { label: 'إجراءات موثّقة', val: 42, suffix: '' },\n        { label: 'أعضاء الفريق', val: 12, suffix: '' },\n        { label: 'استقرار التشغيل', val: 98, suffix: '٪' },\n      ],\n      bars: [\n        { d: 'سبت', h: 45 }, { d: 'أحد', h: 62 }, { d: 'إثن', h: 55 },\n        { d: 'ثلا', h: 78 }, { d: 'أرب', h: 68 }, { d: 'خمي', h: 90 }, { d: 'جمع', h: 82 },\n      ],\n      tasks: [\n        { t: 'مراجعة طلبات الصباح', mark: '✓', bg: 'var(--accent)', bd: 'var(--accent)', color: '#6f7aa0', deco: 'line-through' },\n        { t: 'تحديث دليل التشغيل', mark: '✓', bg: 'var(--accent)', bd: 'var(--accent)', color: '#6f7aa0', deco: 'line-through' },\n        { t: 'متابعة مؤشرات الأداء', mark: '', bg: 'transparent', bd: 'rgba(120,140,220,.3)', color: '#cbd2e6', deco: 'none' },\n        { t: 'تدريب موظف جديد', mark: '', bg: 'transparent', bd: 'rgba(120,140,220,.3)', color: '#cbd2e6', deco: 'none' },\n      ],\n      features: [\n        { n: '01', t: 'إجراءات العمل' }, { n: '02', t: 'المهام اليومية' },\n        { n: '03', t: 'قواعد التشغيل' }, { n: '04', t: 'النماذج' },\n        { n: '05', t: 'الأدلة الداخلية' }, { n: '06', t: 'مؤشرات الأداء' },\n        { n: '07', t: 'لوحة متابعة الفريق' },\n      ],\n      stats: [\n        { val: 3, suffix: '', label: 'أشهر مدّة التأسيس' },\n        { val: 7, suffix: '', label: 'مكوّنات النظام الذكي' },\n        { val: 100, suffix: '٪', label: 'مصمّم خصيصًا لمتجرك' },\n      ],\n      results: [\n        'تشغيل أكثر استقرارًا', 'وضوح في المسؤوليات', 'سرعة في اتخاذ القرار',\n        'سهولة تدريب الموظفين الجدد', 'تقليل الأخطاء التشغيلية', 'قابلية التوسّع دون فوضى',\n      ],\n    };\n  }\n\n  _setMenu(open) {\n    this.setState({ menuOpen: open });\n    const menu = this.menuRef.current;\n    const icon = this.burgerIconRef.current;\n    if (menu) {\n      menu.style.display = open ? 'flex' : 'none';\n      if (open) menu.style.animation = 'amMenuIn .28s cubic-bezier(.16,1,.3,1)';\n    }\n    if (icon) {\n      const bars = icon.children;\n      if (open) {\n        bars[0].style.top = '5px'; bars[0].style.transform = 'rotate(45deg)';\n        bars[1].style.opacity = '0';\n        bars[2].style.top = '5px'; bars[2].style.transform = 'rotate(-45deg)';\n      } else {\n        bars[0].style.top = '0'; bars[0].style.transform = 'none';\n        bars[1].style.opacity = '1';\n        bars[2].style.top = '10px'; bars[2].style.transform = 'none';\n      }\n    }\n  }\n\n  _cursor(scale, filled) {\n    const c = this.cursorRef.current;\n    if (!c) return;\n    const s = 34 * scale;\n    c.style.width = s + 'px';\n    c.style.height = s + 'px';\n    c.style.margin = (-s / 2) + 'px 0 0 ' + (-s / 2) + 'px';\n    c.style.background = filled ? 'rgba(91,127,255,.18)' : 'transparent';\n  }\n\n  componentDidMount() {\n    const root = this.rootRef.current;\n    const reduce = !!(this.props && this.props.reduceMotion) || window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    this._applyAccent();\n\n    const isMobile = () => window.innerWidth <= 820;\n    // responsive nav links (CSS hides on mobile via !important; JS only shows on desktop)\n    const setNav = () => {\n      const links = root.querySelector('[data-navlinks]');\n      if (links) links.style.display = window.innerWidth > 820 ? 'flex' : 'none';\n      if (!isMobile() && this.state.menuOpen) this._setMenu(false);\n    };\n    setNav();\n    window.addEventListener('resize', setNav);\n\n    // ---- mouse glow + custom cursor ----\n    const isTouch = matchMedia('(pointer:coarse)').matches;\n    let mx = window.innerWidth / 2, my = window.innerHeight * 0.3;\n    let cx = mx, cy = my;\n    const glow = this.glowRef.current;\n    const cursor = this.cursorRef.current;\n    const onMove = (e) => {\n      mx = e.clientX; my = e.clientY;\n      if (glow) glow.style.setProperty('--mx', mx + 'px'), glow.style.setProperty('--my', my + 'px');\n      if (cursor && !isTouch) cursor.style.opacity = '1';\n    };\n    window.addEventListener('mousemove', onMove);\n    if (!isTouch && cursor) {\n      const lerp = () => {\n        cx += (mx - cx) * 0.18; cy += (my - cy) * 0.18;\n        cursor.style.transform = 'translate(' + cx + 'px,' + cy + 'px)';\n        this._raf2 = requestAnimationFrame(lerp);\n      };\n      lerp();\n    }\n\n    // ---- scroll: progress, nav bg, parallax, timeline ----\n    const parEls = [...root.querySelectorAll('[data-parallax]')];\n    const nav = this.navRef.current;\n    const prog = this.progressRef.current;\n    const tl = this.timelineRef.current;\n    const tlFill = this.timelineFillRef.current;\n    const onScroll = () => {\n      const y = window.scrollY;\n      const h = document.documentElement.scrollHeight - window.innerHeight;\n      if (prog) prog.style.width = (Math.min(1, y / (h || 1)) * 100) + '%';\n      if (nav) {\n        if (y > 30) { nav.style.background = 'rgba(5,7,15,.72)'; nav.style.backdropFilter = 'blur(16px)'; nav.style.borderBottomColor = 'rgba(120,140,220,.1)'; }\n        else { nav.style.background = 'transparent'; nav.style.backdropFilter = 'none'; nav.style.borderBottomColor = 'transparent'; }\n      }\n      if (!reduce) for (const el of parEls) {\n        const sp = parseFloat(el.getAttribute('data-parallax')) || 0;\n        const r = el.getBoundingClientRect();\n        const off = (r.top + r.height / 2 - window.innerHeight / 2) * -sp;\n        el.style.transform = 'translateY(' + off.toFixed(1) + 'px)';\n      }\n      // timeline fill\n      if (tl && tlFill) {\n        const r = tl.getBoundingClientRect();\n        const start = window.innerHeight * 0.7;\n        const p = Math.max(0, Math.min(1, (start - r.top) / (r.height * 0.85)));\n        tlFill.style.height = (p * 100) + '%';\n        const nodes = [...tl.querySelectorAll('[data-tl-node]')];\n        nodes.forEach((n, i) => {\n          const nr = n.getBoundingClientRect();\n          if (nr.top < window.innerHeight * 0.72) {\n            n.style.background = 'linear-gradient(135deg,var(--accent),var(--accent-bright))';\n            n.style.borderColor = 'transparent';\n            n.style.color = '#fff';\n            n.style.boxShadow = '0 0 22px var(--glow)';\n          } else {\n            n.style.background = '#080b18'; n.style.borderColor = 'rgba(120,140,220,.25)';\n            n.style.color = '#7a85ad'; n.style.boxShadow = 'none';\n          }\n        });\n      }\n    };\n    window.addEventListener('scroll', onScroll, { passive: true });\n    onScroll();\n\n    // ---- scroll-driven reveals / counters / bars (rect-based for reliability) ----\n    const ar = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];\n    const toAr = (n) => String(n).split('').map(ch => ar[+ch] ?? ch).join('');\n    const reveals = [...root.querySelectorAll('[data-amr]')];\n    const counts = [...root.querySelectorAll('[data-count]')];\n    const barGroups = [...root.querySelectorAll('[data-bars]')];\n    const inView = (el, f) => { const r = el.getBoundingClientRect(); return r.top < window.innerHeight * f && r.bottom > 0; };\n    const runCount = (el) => {\n      const target = parseFloat(el.getAttribute('data-count')) || 0;\n      const suf = el.getAttribute('data-suffix') || '';\n      const dur = 1400; const t0 = performance.now();\n      const tick = (t) => {\n        const k = Math.min(1, (t - t0) / dur);\n        const eased = 1 - Math.pow(1 - k, 3);\n        el.textContent = toAr(Math.round(target * eased)) + suf;\n        if (k < 1) requestAnimationFrame(tick);\n      };\n      requestAnimationFrame(tick);\n    };\n    const checkAll = () => {\n      for (let i = reveals.length - 1; i >= 0; i--) {\n        const el = reveals[i];\n        if (inView(el, 0.92)) {\n          let delay = 0; const p = el.parentElement;\n          if (p && p.hasAttribute('data-stagger')) delay = [...p.children].indexOf(el) * 70;\n          el.style.transitionDelay = delay + 'ms';\n          el.style.opacity = '1'; el.style.transform = 'none'; el.style.filter = 'none';\n          reveals.splice(i, 1);\n        }\n      }\n      for (let i = counts.length - 1; i >= 0; i--) {\n        const el = counts[i];\n        if (inView(el, 0.85)) { runCount(el); counts.splice(i, 1); }\n      }\n      for (let i = barGroups.length - 1; i >= 0; i--) {\n        const g = barGroups[i];\n        if (inView(g, 0.85)) {\n          g.querySelectorAll('[data-bar]').forEach((b, j) => setTimeout(() => { b.style.height = (b.getAttribute('data-h') || 50) + '%'; }, j * 80));\n          barGroups.splice(i, 1);\n        }\n      }\n    };\n    window.addEventListener('scroll', checkAll, { passive: true });\n    checkAll();\n    let polls = 0;\n    const poll = () => { checkAll(); if (++polls < 150 && (reveals.length || counts.length || barGroups.length)) requestAnimationFrame(poll); };\n    poll();\n\n    // ---- card tilt (pointer) ----\n    if (!isTouch && !reduce) {\n      root.querySelectorAll('[data-tilt]').forEach(card => {\n        card.addEventListener('mousemove', (ev) => {\n          const r = card.getBoundingClientRect();\n          const px = (ev.clientX - r.left) / r.width - 0.5;\n          const py = (ev.clientY - r.top) / r.height - 0.5;\n          card.style.transform = 'perspective(900px) rotateX(' + (-py * 5).toFixed(2) + 'deg) rotateY(' + (px * 5).toFixed(2) + 'deg) translateY(-6px)';\n        });\n        card.addEventListener('mouseleave', () => { card.style.transform = ''; });\n      });\n    }\n\n    // ---- hero pillars canvas (lighter on mobile) ----\n    if (!reduce) this._initCanvas(() => ({ mx, my }));\n\n    // close mobile menu when a hash link is tapped / on outside scroll\n    window.addEventListener('scroll', () => { if (this.state.menuOpen) this._setMenu(false); }, { passive: true });\n  }\n\n  _applyAccent() {\n    const root = this.rootRef.current;\n    if (!root) return;\n    const a = (this.props && this.props.accentColor) || '#325dde';\n    root.style.setProperty('--accent', a);\n    // derive a brighter variant\n    root.style.setProperty('--accent-bright', this._lighten(a, 0.22));\n    root.style.setProperty('--glow', this._rgba(this._lighten(a, 0.22), 0.55));\n  }\n  componentDidUpdate() { this._applyAccent(); }\n\n  _lighten(hex, amt) {\n    const c = this._hex(hex);\n    const l = (v) => Math.round(v + (255 - v) * amt);\n    return 'rgb(' + l(c.r) + ',' + l(c.g) + ',' + l(c.b) + ')';\n  }\n  _rgba(rgb, a) {\n    const m = rgb.match(/\\d+/g);\n    return 'rgba(' + m[0] + ',' + m[1] + ',' + m[2] + ',' + a + ')';\n  }\n  _hex(h) {\n    h = h.replace('#', '');\n    if (h.length === 3) h = h.split('').map(x => x + x).join('');\n    return { r: parseInt(h.slice(0, 2), 16), g: parseInt(h.slice(2, 4), 16), b: parseInt(h.slice(4, 6), 16) };\n  }\n\n  _initCanvas(getMouse) {\n    const cv = this.canvasRef.current;\n    if (!cv) return;\n    const ctx = cv.getContext('2d');\n    let W = 0, H = 0, DPR = 1;\n    const resize = () => {\n      DPR = Math.min(window.devicePixelRatio || 1, 2);\n      W = cv.clientWidth; H = cv.clientHeight;\n      cv.width = W * DPR; cv.height = H * DPR;\n      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);\n    };\n    resize();\n    window.addEventListener('resize', resize);\n    const N = 5;\n    const pillars = [];\n    for (let i = 0; i < N; i++) pillars.push({ phase: Math.random() * Math.PI * 2, lp: Math.random(), sp: 0.0009 + Math.random() * 0.0012 });\n    const accent = () => getComputedStyle(this.rootRef.current).getPropertyValue('--accent-bright').trim() || '#5b7fff';\n    let t = 0;\n    const draw = (now) => {\n      t = now;\n      ctx.clearRect(0, 0, W, H);\n      const { mx, my } = getMouse();\n      const parX = (mx / window.innerWidth - 0.5);\n      const parY = (my / window.innerHeight - 0.5);\n      const acc = accent();\n      const m = acc.match(/\\d+/g) || [91, 127, 255];\n      const baseY = H * 0.96;\n      const cw = Math.min(W * 0.072, 92);\n      const spacing = Math.min(W * 0.135, 175);\n      const cxc = W / 2;\n      for (let i = 0; i < N; i++) {\n        const depth = (i - (N - 1) / 2);\n        const px = cxc + depth * spacing + parX * (28 + Math.abs(depth) * 14);\n        const ph = pillars[i];\n        const sway = Math.sin(t * 0.0006 + ph.phase) * 10;\n        const baseH = H * (0.42 + 0.13 * Math.sin(ph.phase));\n        const ph2 = baseH + Math.sin(t * 0.0008 + ph.phase) * 26 + parY * 20 * (1 - Math.abs(depth) / 3);\n        const x = px + sway - cw / 2;\n        const top = baseY - ph2;\n        // pillar body\n        const g = ctx.createLinearGradient(0, top, 0, baseY);\n        g.addColorStop(0, 'rgba(' + m[0] + ',' + m[1] + ',' + m[2] + ',0.16)');\n        g.addColorStop(0.5, 'rgba(' + m[0] + ',' + m[1] + ',' + m[2] + ',0.05)');\n        g.addColorStop(1, 'rgba(' + m[0] + ',' + m[1] + ',' + m[2] + ',0.005)');\n        ctx.fillStyle = g;\n        this._rr(ctx, x, top, cw, ph2, cw / 2);\n        ctx.fill();\n        // edge\n        ctx.strokeStyle = 'rgba(' + m[0] + ',' + m[1] + ',' + m[2] + ',0.10)';\n        ctx.lineWidth = 1;\n        ctx.stroke();\n        // top glow cap\n        ctx.beginPath();\n        ctx.fillStyle = 'rgba(' + m[0] + ',' + m[1] + ',' + m[2] + ',0.6)';\n        ctx.shadowColor = 'rgba(' + m[0] + ',' + m[1] + ',' + m[2] + ',0.9)';\n        ctx.shadowBlur = 22;\n        ctx.arc(x + cw / 2, top, 2.2, 0, Math.PI * 2);\n        ctx.fill();\n        ctx.shadowBlur = 0;\n        // traveling light dot\n        ph.lp += ph.sp * 16;\n        if (ph.lp > 1) ph.lp -= 1;\n        const ly = baseY - ph.lp * ph2;\n        const lg = ctx.createRadialGradient(x + cw / 2, ly, 0, x + cw / 2, ly, 26);\n        lg.addColorStop(0, 'rgba(' + m[0] + ',' + m[1] + ',' + m[2] + ',0.55)');\n        lg.addColorStop(1, 'rgba(' + m[0] + ',' + m[1] + ',' + m[2] + ',0)');\n        ctx.fillStyle = lg;\n        ctx.fillRect(x - 8, ly - 26, cw + 16, 52);\n      }\n      this._raf = requestAnimationFrame(draw);\n    };\n    this._raf = requestAnimationFrame(draw);\n  }\n\n  _rr(ctx, x, y, w, h, r) {\n    r = Math.min(r, w / 2, h / 2);\n    ctx.beginPath();\n    ctx.moveTo(x + r, y);\n    ctx.arcTo(x + w, y, x + w, y + h, r);\n    ctx.arcTo(x + w, y + h, x, y + h, 0);\n    ctx.arcTo(x, y + h, x, y, 0);\n    ctx.arcTo(x, y, x + w, y, r);\n    ctx.closePath();\n  }\n\n  componentWillUnmount() {\n    cancelAnimationFrame(this._raf);\n    cancelAnimationFrame(this._raf2);\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
